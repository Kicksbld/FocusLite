# XcodeGen spec. Source of truth for FocusLite.xcodeproj (which is generated, not committed).
# Regenerate with: xcodegen generate

name: FocusLite

options:
  bundleIdPrefix: com.killianboularand
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: CNLG2XPDKN
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  FocusLite:
    type: application
    platform: iOS
    sources:
      - path: FocusLite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.killianboularand.focuslite
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: FocusLite/Info.plist
      properties:
        CFBundleDisplayName: FocusLite
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.killianboularand.focuslite
            CFBundleURLSchemes:
              - focuslite
    entitlements:
      path: FocusLite/FocusLite.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.killianboularand.focuslite
    dependencies:
      - target: ShieldConfigurationExtension
      - target: ShieldActionExtension
      - target: DeviceActivityMonitorExtension

  ShieldConfigurationExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldConfigurationExtension
      - path: FocusLite/Shared
      # Brand colors only (AccentColor, Ink), without the app icon.
      - path: FocusLite/Resources/Brand.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.killianboularand.focuslite.shieldconfig
    info:
      path: ShieldConfigurationExtension/Info.plist
      properties:
        CFBundleDisplayName: ShieldConfigurationExtension
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: ShieldConfigurationExtension/ShieldConfigurationExtension.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.killianboularand.focuslite

  ShieldActionExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldActionExtension
      - path: FocusLite/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.killianboularand.focuslite.shieldaction
    info:
      path: ShieldActionExtension/Info.plist
      properties:
        CFBundleDisplayName: ShieldActionExtension
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: ShieldActionExtension/ShieldActionExtension.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.killianboularand.focuslite

  DeviceActivityMonitorExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: DeviceActivityMonitorExtension
      - path: FocusLite/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.killianboularand.focuslite.monitor
    info:
      path: DeviceActivityMonitorExtension/Info.plist
      properties:
        CFBundleDisplayName: DeviceActivityMonitorExtension
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: DeviceActivityMonitorExtension/DeviceActivityMonitorExtension.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.killianboularand.focuslite

schemes:
  FocusLite:
    build:
      targets:
        FocusLite: all
    run:
      config: Debug
